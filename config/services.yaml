# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Stratégie de tirage utilisée par le jeu : pour changer d'algorithme,
    # il suffit de pointer cet alias vers une autre implémentation.
    App\Service\Game\PrizeSelectorInterface: '@App\Service\Game\WeightedPrizeSelector'
    App\Service\Game\RandomNumberGeneratorInterface: '@App\Service\Game\CryptoRandomNumberGenerator'

when@test:
    services:
        # Remplace le générateur cryptographique par un double piloté par un
        # état statique (App\Tests\Support\TestRandomNumberGenerator), pour
        # que les tests fonctionnels puissent figer le pile ou face de la
        # roue. Remplacer le service après coup via le conteneur ne
        # suffirait pas : SpinService et WeightedPrizeSelector sont déjà
        # câblés avec leur dépendance au moment de la requête HTTP.
        App\Service\Game\RandomNumberGeneratorInterface: '@App\Tests\Support\TestRandomNumberGenerator'
        App\Tests\Support\TestRandomNumberGenerator: ~
